<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Dark bg -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#120d2e"/>
      <stop offset="100%" stop-color="#07051a"/>
    </radialGradient>
    <!-- Letter gradient -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#c084fc"/>
      <stop offset="50%"  stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <!-- Outer glow filter -->
    <filter id="outerGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Inner sharper glow -->
    <filter id="innerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Subtle inner ring -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="none"
        stroke="rgba(168,85,247,0.25)" stroke-width="1"/>

  <!-- Wide outer purple glow behind N -->
  <text x="32" y="47"
        font-family="'Arial Black', 'Arial', sans-serif"
        font-weight="900"
        font-size="42"
        text-anchor="middle"
        fill="rgba(139,92,246,0.35)"
        filter="url(#outerGlow)">N</text>

  <!-- Blue glow layer -->
  <text x="32" y="47"
        font-family="'Arial Black', 'Arial', sans-serif"
        font-weight="900"
        font-size="42"
        text-anchor="middle"
        fill="rgba(99,102,241,0.4)"
        filter="url(#outerGlow)">N</text>

  <!-- Main letter with gradient + inner glow -->
  <text x="32" y="47"
        font-family="'Arial Black', 'Arial', sans-serif"
        font-weight="900"
        font-size="42"
        text-anchor="middle"
        fill="url(#letterGrad)"
        filter="url(#innerGlow)">N</text>

  <!-- Tiny corner sparkle dots -->
  <circle cx="12" cy="12" r="2" fill="#a855f7" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="52" cy="12" r="1.5" fill="#3b82f6" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="52" cy="52" r="1.5" fill="#ec4899" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
