<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0f3c"/>
      <stop offset="100%" stop-color="#07051a"/>
    </linearGradient>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="13" fill="none"
        stroke="rgba(168,85,247,0.4)" stroke-width="1.5"/>

  <!-- Letter N -->
  <text x="32" y="48"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900"
        font-size="42"
        text-anchor="middle"
        fill="url(#lg)">N</text>

  <!-- Corner accent dots -->
  <circle cx="12" cy="12" r="2" fill="#a855f7" opacity="0.75"/>
  <circle cx="52" cy="12" r="1.5" fill="#3b82f6" opacity="0.65"/>
  <circle cx="52" cy="52" r="1.5" fill="#ec4899" opacity="0.55"/>
</svg>
